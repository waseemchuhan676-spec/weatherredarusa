      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#radGrad)" />
  <!-- Radar circles -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="8" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
  <!-- Radar sweep -->
  <path d="M 32 32 L 52 16 A 24 24 0 0 0 32 8 Z" fill="rgba(56,189,248,0.4)" />
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <!-- Storm blip -->
